MEMORY {
    HEADER:     start = $0000, size = $0010, file = %O, fill = yes;
    PRG_ROM:    start = $8000, size = $8000, file = %O, fill = yes;
    CHR_ROM:    start = $0000, size = $2000, file = %O, fill = yes;

    ZP:         start = $0000, size = $0100, type = rw, file = "";
    OAM:        start = $0200, size = $0100, type = rw, file = "";
    RAM:        start = $0300, size = $0500, type = rw, file = "";
}

SEGMENTS {
    HEADER:     load = HEADER,  type = ro;
    CODE:       load = PRG_ROM, type = ro, start = $8000;
    RODATA:     load = PRG_ROM, type = ro, optional = yes;
    VECTORS:    load = PRG_ROM, type = ro, start = $FFFA;
    CHARS:      load = CHR_ROM, type = ro;

    ZEROPAGE:   load = ZP,      type = zp;
    BSS:        load = RAM,     type = bss, define = yes;
}